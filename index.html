<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日財經晨報 — App 預覽版</title>
<meta name="description" content="每日財經晨報 Android App 的網頁預覽版，資料每天自動更新。">

<!-- 分享到 LINE / Messenger 時顯示的預覽卡片 -->
<meta property="og:title" content="每日財經晨報 — App 預覽版">
<meta property="og:description" content="每天自動彙整國際財經新聞與市場行情，由 AI 產生的晨報。">
<meta property="og:type" content="website">

<style>
/* ============================================================
   配色
   ------------------------------------------------------------
   數值直接對應 App 的 ui/theme/Theme.kt 與 Color.kt，
   所以網頁看起來會和實機幾乎一樣。
   跟隨瀏覽器（或作業系統）的深淺色設定，這點也和 App 一致。
   ============================================================ */
:root {
  /* 淺色模式：對應 Theme.kt 的 LightColors */
  --bg:            #F7F8FA;
  --on-bg:         #16181C;
  --surface:       #FFFFFF;
  --on-surface:    #16181C;
  --surface-var:   #E9ECF2;
  --on-surface-var:#5A606B;
  --primary:       #0B1F3A;
  --primary-cont:  #D6E2F5;
  --on-primary-cont:#0B1F3A;
  --gold:          #B8860B;

  /* 漲跌色：對應 Color.kt（綠漲紅跌） */
  --up:            #1B7F3B;
  --down:          #D32F2F;

  /* 頁面本身（手機框外面）的背景 */
  --page-bg:       #E7EAF0;
  --page-fg:       #2A2F38;
  --page-muted:    #6B717C;
}

@media (prefers-color-scheme: dark) {
  :root {
    /* 深色模式：對應 Theme.kt 的 DarkColors */
    --bg:            #101318;
    --on-bg:         #E4E6EA;
    --surface:       #171A20;
    --on-surface:    #E4E6EA;
    --surface-var:   #272B33;
    --on-surface-var:#AEB4BF;
    --primary:       #A9C4EC;
    --primary-cont:  #243B5C;
    --on-primary-cont:#D6E2F5;
    --gold:          #E0B44A;

    --up:            #5FD787;
    --down:          #FF7A7A;

    --page-bg:       #0A0C10;
    --page-fg:       #D8DBE0;
    --page-muted:    #868C97;
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--page-bg);
  color: var(--page-fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------- 頁面外層 ---------- */
.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 16px 40px;
  gap: 18px;
}

.intro { text-align: center; max-width: 460px; }
.intro h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: .5px; }
.intro p  { font-size: 13px; line-height: 1.7; margin: 0; color: var(--page-muted); }
.intro a  { color: inherit; }

.badge {
  display: inline-block;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid currentColor;
  color: var(--page-muted);
  margin-bottom: 10px;
}

/* ---------- 手機外框 ---------- */
.phone {
  width: 390px;
  max-width: 100%;
  height: 800px;
  max-height: calc(100vh - 150px);
  min-height: 560px;
  background: var(--bg);
  border-radius: 38px;
  border: 10px solid #14161b;
  box-shadow: 0 18px 50px rgba(0,0,0,.32);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* 手機的狀態列（只是裝飾，讓畫面看起來像真的手機） */
.statusbar {
  flex: 0 0 auto;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  font-size: 11px;
  font-weight: 600;
  color: var(--on-surface-var);
  background: var(--bg);
}
.statusbar .icons { display: flex; gap: 5px; align-items: center; }

/* ---------- 內容區 ---------- */
.screen {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 16px 16px;
  background: var(--bg);
  color: var(--on-bg);
  -webkit-overflow-scrolling: touch;
}
.screen::-webkit-scrollbar { width: 0; }

/* ---------- 底部三分頁 ---------- */
.navbar {
  flex: 0 0 auto;
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--surface-var);
  padding: 6px 0 10px;
}
.navitem {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  border: 0;
  background: none;
  cursor: pointer;
  padding: 4px 0;
  color: var(--on-surface-var);
  font-family: inherit;
  font-size: 11px;
}
.navitem .pill {
  padding: 3px 18px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .18s ease;
}
.navitem.active { color: var(--on-primary-cont); }
.navitem.active .pill { background: var(--primary-cont); }
.navitem svg { display: block; }

/* ---------- 共用元件 ---------- */
.card {
  background: var(--surface);
  border-radius: 16px;
  box-shadow: 0 1px 3px rgba(0,0,0,.12);
}
.notice {
  background: var(--primary-cont);
  color: var(--on-primary-cont);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 12px;
}
.muted    { color: var(--on-surface-var); }
.label    { font-size: 12px; line-height: 1.4; color: var(--on-surface-var); }
.section-title { font-size: 16px; font-weight: 600; color: var(--on-bg); margin: 0; }

.centered {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 12px;
  text-align: center;
  color: var(--on-surface-var);
  font-size: 13px;
  line-height: 1.7;
  padding: 0 20px;
}
.spinner {
  width: 30px; height: 30px;
  border: 3px solid var(--surface-var);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 簡報頁 ---------- */
.brief-date  { font-size: 12px; color: var(--on-surface-var); }
.brief-title {
  font-size: 22px;
  line-height: 1.4;
  font-weight: 700;
  margin: 4px 0 16px;
  color: var(--on-bg);
}

/* 市場行情 */
.market { padding: 8px 0; margin-bottom: 20px; }
.market h2 { font-size: 16px; font-weight: 600; margin: 0; padding: 8px 16px; }
.market .divider { height: 1px; background: var(--surface-var); }
.market .divider.inset { margin-left: 16px; }

.mrow {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
}
.mrow .name  { font-size: 16px; color: var(--on-surface); line-height: 1.3; }
.mrow .tick  { font-size: 12px; color: var(--on-surface-var); }
.mrow .left  { flex: 1; min-width: 0; }
.mrow .left > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .right { text-align: right; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.mrow .price { font-size: 16px; font-weight: 500; color: var(--on-surface); }
.mrow .chg   { font-size: 12px; font-weight: 700; }

.up   { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--on-surface-var); }

.toggle {
  width: 100%;
  border: 0;
  background: none;
  cursor: pointer;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: var(--primary);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
}
.toggle svg { transition: transform .2s ease; }

/* ---------- Markdown 內文 ---------- */
.md { font-size: 16px; line-height: 1.65; color: var(--on-bg); }
.md h2 {
  font-size: 20px; font-weight: 700; line-height: 1.4;
  margin: 22px 0 8px; color: var(--on-bg);
}
.md h3 {
  font-size: 16px; font-weight: 600;
  margin: 18px 0 6px; color: var(--on-bg);
}
.md h2:first-child, .md h3:first-child { margin-top: 0; }
.md p  { margin: 8px 0; }
.md ul, .md ol { margin: 8px 0; padding-left: 22px; }
.md li { margin: 5px 0; }
.md hr { border: 0; border-top: 1px solid var(--surface-var); margin: 18px 0; }
.md blockquote {
  margin: 10px 0;
  padding: 4px 0 4px 12px;
  border-left: 3px solid var(--gold);
  color: var(--on-surface-var);
}
.md code {
  background: var(--surface-var);
  padding: 1px 5px;
  border-radius: 4px;
  font-size: .88em;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.md strong { font-weight: 700; }

/* 表格：外層可左右滑動，窄螢幕才不會撐破版面 */
.md .tablewrap {
  overflow-x: auto;
  background: var(--surface);
  border-radius: 12px;
  margin: 12px 0;
  box-shadow: 0 1px 3px rgba(0,0,0,.12);
}
.md table { border-collapse: collapse; width: 100%; font-size: 14px; }
.md th, .md td {
  padding: 10px;
  text-align: left;
  white-space: nowrap;
  border-bottom: 1px solid var(--surface-var);
}
.md th { font-weight: 700; color: var(--on-surface); }
.md tr:last-child td { border-bottom: 0; }

/* 免責聲明。放在 App 畫面內，窄螢幕才看得到 */
.disclaimer {
  margin: 28px 0 24px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--surface-var);
  font-size: 12px;
  line-height: 1.7;
  color: var(--on-surface-var);
}

/* ---------- 資料來源頁 ---------- */
.srccard {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px;
  margin-bottom: 10px;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}
.srccard:hover { background: var(--surface-var); }
/* 縮圖：佔位圖永遠在底下，圖片載入成功時蓋在上面。
   圖片載入失敗時把自己移除，底下的佔位圖就露出來了。
   這樣就不需要把資料內容拼進 JavaScript 字串裡（見下方安全性說明）。 */
.thumbbox {
  position: relative;
  width: 96px; height: 96px;
  flex: 0 0 96px;
  border-radius: 12px;
  overflow: hidden;
  background: var(--surface-var);
}
.thumb {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.thumb-ph {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--on-surface-var);
  font-size: 30px;
  font-weight: 700;
}
.srccard .headline {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--on-surface);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.srccard .pub { font-size: 12px; color: var(--primary); margin-top: 6px; }

/* ---------- 過去的簡報頁 ---------- */
.hrow {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: var(--bg);
  color: inherit;
  font-family: inherit;
  border-radius: 12px;
  padding: 14px 12px;
  cursor: pointer;
}
.hrow.sel { background: var(--primary-cont); }
.hrow .t  { font-size: 16px; line-height: 1.4; color: var(--on-surface);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow.sel .t { font-weight: 700; }
.hrow .d  { font-size: 12px; color: var(--on-surface-var); margin-top: 4px; }
.hdiv { height: 1px; background: var(--surface-var); margin: 0 4px; }

/* ---------- 窄螢幕：手機開啟時就滿版，不要小小一格 ---------- */
@media (max-width: 480px) {
  .page { padding: 0; gap: 0; }
  .intro { display: none; }
  .phone {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-height: none;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }
  .footnote { display: none; }
}

.footnote {
  font-size: 12px;
  color: var(--page-muted);
  text-align: center;
  max-width: 460px;
  line-height: 1.7;
}
.footnote a { color: inherit; }
</style>
</head>

<body>
<div class="page">

  <div class="intro">
    <div class="badge">網頁預覽版</div>
    <h1>每日財經晨報</h1>
    <p>
      每天自動彙整 10 個國際新聞來源與 27 檔行情，交給 AI 產生的財經晨報。<br>
      這是 Android App 的網頁重現版，資料與 App 讀取的是同一份，每天自動更新。
    </p>
  </div>

  <div class="phone">
    <div class="statusbar">
      <span id="clock">—:—</span>
      <span class="icons">
        <svg width="14" height="11" viewBox="0 0 24 20" fill="currentColor"><path d="M1 9l2-2a13 13 0 0118 0l2 2-2 2a10 10 0 00-18 0z" opacity=".55"/><circle cx="12" cy="16" r="2.5"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h4V9H3v9zm7 0h4V4h-4v14zm7 0h4v-6h-4v6z"/></svg>
        <svg width="18" height="11" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1" y="1" width="20" height="12" rx="3"/><path d="M23.5 5.5v3" stroke-linecap="round"/><rect x="3" y="3" width="16" height="8" rx="1.5" fill="currentColor" stroke="none"/></svg>
      </span>
    </div>

    <div class="screen" id="screen">
      <div class="centered">
        <div class="spinner"></div>
        <div>載入中…</div>
      </div>
    </div>

    <nav class="navbar" id="navbar">
      <button class="navitem active" data-tab="briefing">
        <span class="pill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm-2 12H7v-2h10v2zm0-4H7V9h10v2zm0-4H7V5h10v2z"/></svg>
        </span>
        <span>簡報</span>
      </button>
      <button class="navitem" data-tab="sources">
        <span class="pill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7a5 5 0 000 10h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4a5 5 0 000-10z"/></svg>
        </span>
        <span>資料來源</span>
      </button>
      <button class="navitem" data-tab="history">
        <span class="pill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a9 9 0 00-9 9H1l3.9 3.9.1.1L9 12H6a7 7 0 117 7 6.9 6.9 0 01-4.9-2L6.7 18.4A9 9 0 1013 3zm-1 5v5l4.3 2.5.7-1.2-3.5-2.1V8H12z"/></svg>
        </span>
        <span>過去的簡報</span>
      </button>
    </nav>
  </div>

  <div class="footnote">
    內容由 AI 自動彙整國際財經新聞產生，僅供參考，不構成任何投資建議。<br>
    資料來源：<a href="https://github.com/redtea0412/daily-briefing-data" target="_blank" rel="noopener">daily-briefing-data</a>
  </div>

</div>

<script>
/* ============================================================
   資料來源設定
   ------------------------------------------------------------
   這個網頁就住在存放 JSON 的同一個 repo 裡，由 GitHub Pages 提供。
   也就是說 index.html 和 index.json 是「鄰居」：

       https://redtea0412.github.io/daily-briefing-data/
       ├── index.html   ← 你正在看的這一頁
       ├── index.json   ← 目錄
       └── data/*.json  ← 每日簡報

   所以用 '.' （代表「跟我同一層」）就讀得到，
   不需要寫完整網址，也不會有跨網域（CORS）的問題。

   【2026-09-20 從 Netlify 方案改過來】
   原本這裡寫 '/gh'，那是 Netlify 的伺服器端代理路徑，
   目的是隱藏 GitHub 帳號。後來 Netlify 註冊未成功而改用 GitHub Pages，
   而 Pages 的網址本來就帶帳號，隱藏已無意義，就改用最單純的相對路徑。

   ⚠️ 如果哪天要把這個網頁搬到「不是這個 repo」的地方，
      記得要改回完整網址，否則會讀不到資料：
      const REPO_BASE = 'https://raw.githubusercontent.com/redtea0412/daily-briefing-data/main';

   網址後面接上時間戳，是為了避開 CDN 快取
   （App 的 BriefingApi.kt 也是用同樣的手法）。
   ============================================================ */
const REPO_BASE = '.';

const bust = () => '?t=' + Date.now();

/* ============================================================
   共用狀態
   ------------------------------------------------------------
   selectedDate 三個分頁共用 —— 這正是 App 的核心行為
   （見 SharedBriefingViewModel.kt）。
   在「過去的簡報」點某一天，簡報頁與資料來源頁會同時跟著換。
   ============================================================ */
const state = {
  tab: 'briefing',
  index: [],            // [{date, title}, ...] 由新到舊
  briefings: {},        // { '2026-07-30': {...} } 已下載的內容
  selectedDate: null,
  marketExpanded: false,
  loading: true,
  error: null,
};

const screenEl = document.getElementById('screen');

/* ---------- 小工具 ---------- */

const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/**
 * 只允許 http / https 的網址，其餘一律回傳 null。
 *
 * 為什麼需要這個：新聞網址與縮圖網址都來自外部 RSS，不是我們自己產生的。
 * 如果某個來源被入侵、塞進 javascript:... 這種網址，
 * 使用者點下去就會在這個頁面上執行對方的程式碼。
 * 與其相信來源，不如在這裡直接擋掉。
 */
function safeUrl(u) {
  if (!u) return null;
  try {
    const parsed = new URL(String(u), location.href);
    return (parsed.protocol === 'http:' || parsed.protocol === 'https:')
      ? parsed.href : null;
  } catch {
    return null;
  }
}

/** 價格：千分位 + 兩位小數；沒有數值時顯示破折號（對應 App 的 formatPrice） */
function formatPrice(v) {
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  return Number(v).toLocaleString('en-US',
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/** 漲跌幅：正數要加 + 號（對應 App 的 formatChange） */
function formatChange(v) {
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  return (v > 0 ? '+' : '') + Number(v).toFixed(2) + '%';
}

/** 漲跌對應的顏色類別。綠漲紅紅、零與無資料為灰 */
function changeClass(v) {
  if (v === null || v === undefined || Number.isNaN(v) || v === 0) return 'flat';
  return v > 0 ? 'up' : 'down';
}

/** 2026-07-30 → 2026 年 07 月 30 日（對應 App 的 formatDateForDisplay） */
function formatDateForDisplay(date) {
  const p = String(date).split('-');
  return p.length === 3 ? `${p[0]} 年 ${p[1]} 月 ${p[2]} 日` : date;
}

/** 判斷是不是大盤指數：代號以 ^ 開頭（與 App 的 isIndex() 同一條規則） */
const isIndex = (item) => String(item.ticker || '').trimStart().startsWith('^');

/* ============================================================
   Markdown 轉 HTML
   ------------------------------------------------------------
   刻意只支援 App 那個渲染器（MarkdownText.kt）支援的語法，
   這樣網頁看到的排版才會和手機一致：
   標題、清單、引言、分隔線、粗體斜體、行內程式碼、表格。
   ============================================================ */
function renderMarkdown(md) {
  const lines = String(md || '').replace(/\r\n/g, '\n').split('\n');
  const out = [];
  let i = 0;

  // 行內語法：粗體 → 斜體 → 行內程式碼。先跳脫 HTML 才處理，避免注入。
  const inline = (t) => esc(t)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');

  const isTableRow = (l) => l.trim().startsWith('|') && l.includes('|');
  const isSeparator = (l) =>
    l.trim().replace(/\|/g, '').trim().length > 0 &&
    /^[\s|:-]+$/.test(l) && l.includes('-');

  const cells = (l) => {
    let t = l.trim();
    if (t.startsWith('|')) t = t.slice(1);
    if (t.endsWith('|'))  t = t.slice(0, -1);
    return t.split('|').map((c) => c.trim());
  };

  // 判斷儲存格是不是「+數字 / -數字」，是的話要上色（對應 App 的 changeSign）
  const cellClass = (text) => {
    const t = text.trim().replace(/\*\*/g, '').replace(/\s/g, '');
    if (t.length < 2) return '';
    if (!/\d/.test(t[1])) return '';
    if (t[0] === '+') return ' class="up"';
    if (t[0] === '-' || t[0] === '−') return ' class="down"';
    return '';
  };

  while (i < lines.length) {
    const line = lines[i];
    const trimmed = line.trim();

    // 空行
    if (!trimmed) { i++; continue; }

    // 表格：表頭 + 分隔列 + 若干資料列
    if (isTableRow(line) && i + 1 < lines.length && isSeparator(lines[i + 1])) {
      const header = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && isTableRow(lines[i])) {
        rows.push(cells(lines[i]));
        i++;
      }
      let html = '<div class="tablewrap"><table><thead><tr>';
      header.forEach((h) => { html += `<th>${inline(h)}</th>`; });
      html += '</tr></thead><tbody>';
      rows.forEach((r) => {
        html += '<tr>';
        for (let c = 0; c < header.length; c++) {
          const v = r[c] ?? '';
          html += `<td${cellClass(v)}>${inline(v)}</td>`;
        }
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      out.push(html);
      continue;
    }

    // 分隔線
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) { out.push('<hr>'); i++; continue; }

    // 標題
    const h = trimmed.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      const level = Math.min(h[1].length, 3);
      const tag = level <= 2 ? 'h2' : 'h3';
      out.push(`<${tag}>${inline(h[2])}</${tag}>`);
      i++;
      continue;
    }

    // 引言
    if (/^>\s?/.test(trimmed)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i].trim())) {
        buf.push(lines[i].trim().replace(/^>\s?/, ''));
        i++;
      }
      out.push(`<blockquote>${inline(buf.join(' '))}</blockquote>`);
      continue;
    }

    // 有序清單
    if (/^\d+[.)]\s+/.test(trimmed)) {
      const buf = [];
      while (i < lines.length && /^\d+[.)]\s+/.test(lines[i].trim())) {
        buf.push(lines[i].trim().replace(/^\d+[.)]\s+/, ''));
        i++;
      }
      out.push('<ol>' + buf.map((b) => `<li>${inline(b)}</li>`).join('') + '</ol>');
      continue;
    }

    // 無序清單
    if (/^[-*+]\s+/.test(trimmed)) {
      const buf = [];
      while (i < lines.length && /^[-*+]\s+/.test(lines[i].trim())) {
        buf.push(lines[i].trim().replace(/^[-*+]\s+/, ''));
        i++;
      }
      out.push('<ul>' + buf.map((b) => `<li>${inline(b)}</li>`).join('') + '</ul>');
      continue;
    }

    // 一般段落（連續的非空行合併成一段）
    const buf = [];
    while (i < lines.length && lines[i].trim() &&
           !/^(#{1,6}\s|>\s?|[-*+]\s|\d+[.)]\s)/.test(lines[i].trim()) &&
           !isTableRow(lines[i]) &&
           !/^(-{3,}|\*{3,}|_{3,})$/.test(lines[i].trim())) {
      buf.push(lines[i].trim());
      i++;
    }
    if (buf.length) out.push(`<p>${inline(buf.join(' '))}</p>`);
  }

  return out.join('\n');
}

/* ============================================================
   畫面
   ============================================================ */

function viewLoading(text) {
  return `<div class="centered"><div class="spinner"></div><div>${esc(text)}</div></div>`;
}

function viewError(text) {
  return `<div class="centered">
      <div style="font-size:30px">⚠️</div>
      <div>${esc(text)}</div>
    </div>`;
}

/* ---------- 分頁一：簡報 ---------- */
function viewBriefing() {
  const b = state.briefings[state.selectedDate];
  if (!b) return viewLoading('載入 ' + (state.selectedDate || '') + ' 的簡報…');

  const today = new Date().toISOString().slice(0, 10);
  const hasToday = state.index.some((e) => e.date === today);

  let html = '';

  // 提示區：對應 App 的 NoticeCard 邏輯
  if (!hasToday) {
    html += `<div class="notice">今日簡報尚未產生，通常於每日 06:00 更新。以下為最近一筆可用的簡報。</div>`;
  } else if (state.selectedDate !== today) {
    html += `<div class="notice">你正在閱讀 ${esc(b.date)} 的簡報。</div>`;
  }

  html += `<div class="brief-date">${esc(formatDateForDisplay(b.date))}</div>`;
  html += `<div class="brief-title">${esc(b.title || b.date)}</div>`;

  // ---- 市場行情（預設只顯示大盤指數，可展開）----
  const market = Array.isArray(b.market) ? b.market : [];
  if (market.length) {
    let collapsed = market.filter(isIndex);
    if (!collapsed.length) collapsed = market.slice(0, 5);

    const hidden = market.length - collapsed.length;
    const collapsible = hidden > 0;
    const visible = (state.marketExpanded || !collapsible) ? market : collapsed;

    html += `<div class="card market"><h2>市場行情</h2><div class="divider"></div>`;
    visible.forEach((m, idx) => {
      const cls = changeClass(m.change_pct);
      html += `<div class="mrow">
          <div class="left">
            <div class="name">${esc(m.name || m.ticker)}</div>
            <div class="tick">${esc(m.ticker)}</div>
          </div>
          <div class="right">
            <div class="price">${esc(formatPrice(m.price))}</div>
            <div class="chg ${cls}">${esc(formatChange(m.change_pct))}</div>
          </div>
        </div>`;
      if (idx !== visible.length - 1) html += `<div class="divider inset"></div>`;
    });

    if (collapsible) {
      const label = state.marketExpanded ? '收合' : `顯示其他 ${hidden} 項`;
      const rot = state.marketExpanded ? ' style="transform:rotate(180deg)"' : '';
      html += `<div class="divider"></div>
        <button class="toggle" id="marketToggle">
          <span>${esc(label)}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"${rot}><path d="M7.4 8.6L12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>
        </button>`;
    }
    html += `</div>`;
  }

  html += `<div class="md">${renderMarkdown(b.summary || '（這一天沒有內文）')}</div>`;

  // 免責聲明放在「App 畫面內」而不是頁面下方，
  // 因為窄螢幕時手機框會佔滿整個畫面，框外的文字根本看不到。
  html += `<div class="disclaimer">
      本頁內容由 AI 自動彙整新聞產生，可能有錯誤或遺漏，僅供參考，
      不構成任何投資建議。投資決策請自行查證原始資料來源。
    </div>`;
  return html;
}

/* ---------- 分頁二：資料來源 ---------- */
function viewSources() {
  const b = state.briefings[state.selectedDate];
  if (!b) return viewLoading('載入資料來源…');

  const sources = Array.isArray(b.sources) ? b.sources : [];

  let html = `<div class="section-title">${esc(b.date)} 的資料來源</div>
    <div class="label" style="margin-bottom:12px">共 ${sources.length} 則新聞</div>`;

  if (!sources.length) {
    html += `<div class="label" style="padding:24px 0">這一天沒有記錄任何新聞來源。</div>`;
    return html;
  }

  sources.forEach((s) => {
    const initial = esc(String(s.publisher || '?').trim().charAt(0) || '?');

    // 縮圖：佔位圖永遠先畫，圖片成功載入才蓋上去（規格書 5.4：不可破圖或空白）
    const img = safeUrl(s.thumbnail)
      ? `<img class="thumb" src="${esc(s.thumbnail)}" alt="" loading="lazy"
             referrerpolicy="no-referrer" onerror="this.remove()">`
      : '';

    // 網址只接受 http / https。
    // 這些網址來自外部 RSS，萬一哪天有來源被入侵而塞進 javascript: 開頭的連結，
    // 點下去就會在頁面上執行程式碼。這裡直接擋掉，不是等它出事。
    const href = safeUrl(s.url);
    const tag = href ? 'a' : 'div';
    const attrs = href
      ? ` href="${esc(href)}" target="_blank" rel="noopener noreferrer"`
      : '';

    html += `<${tag} class="card srccard"${attrs}>
        <div class="thumbbox"><div class="thumb-ph">${initial}</div>${img}</div>
        <div style="flex:1;min-width:0">
          <div class="headline">${esc(s.headline || s.url || '')}</div>
          <div class="pub">${esc(s.publisher || '未知來源')}</div>
        </div>
      </${tag}>`;
  });

  html += `<div style="height:12px"></div>`;
  return html;
}

/* ---------- 分頁三：過去的簡報 ---------- */
function viewHistory() {
  let html = `<div class="section-title">過去的簡報</div>
    <div class="label" style="margin-bottom:10px">共 ${state.index.length} 筆，由新到舊</div>`;

  if (!state.index.length) {
    html += `<div class="label" style="padding:24px 0">目前還沒有任何簡報。</div>`;
    return html;
  }

  state.index.forEach((e, idx) => {
    const sel = e.date === state.selectedDate ? ' sel' : '';
    html += `<button class="hrow${sel}" data-date="${esc(e.date)}">
        <div class="t">${esc(e.title || e.date)}</div>
        <div class="d">${esc(formatDateForDisplay(e.date))}</div>
      </button>`;
    if (idx !== state.index.length - 1) html += `<div class="hdiv"></div>`;
  });

  html += `<div style="height:12px"></div>`;
  return html;
}

/* ---------- 繪製 ---------- */
function render() {
  if (state.error) {
    screenEl.innerHTML = viewError(state.error);
  } else if (state.loading) {
    screenEl.innerHTML = viewLoading('載入中…');
  } else if (state.tab === 'briefing') {
    screenEl.innerHTML = viewBriefing();
  } else if (state.tab === 'sources') {
    screenEl.innerHTML = viewSources();
  } else {
    screenEl.innerHTML = viewHistory();
  }

  // 底部分頁的選取狀態
  document.querySelectorAll('.navitem').forEach((el) => {
    el.classList.toggle('active', el.dataset.tab === state.tab);
  });

  // 市場行情的展開／收合
  const toggle = document.getElementById('marketToggle');
  if (toggle) {
    toggle.addEventListener('click', () => {
      state.marketExpanded = !state.marketExpanded;
      render();
    });
  }

  // 點過去某一天 → 換日期 + 自動跳到「簡報」分頁（App 的核心行為）
  document.querySelectorAll('.hrow').forEach((el) => {
    el.addEventListener('click', () => selectDate(el.dataset.date));
  });
}

/* ============================================================
   資料載入
   ============================================================ */

async function fetchJson(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

/** 下載某一天的簡報內容（已經有的就不重複下載） */
async function ensureBriefing(date) {
  if (!date || state.briefings[date]) return;
  state.briefings[date] = await fetchJson(`${REPO_BASE}/data/${date}.json${bust()}`);
}

/**
 * 選定某一天。
 * 對應 App 的 SharedBriefingViewModel.selectDate()：
 * 換日期 → 三個分頁同時跟著換 → 自動跳到「簡報」分頁。
 */
async function selectDate(date) {
  state.selectedDate = date;
  state.tab = 'briefing';
  state.marketExpanded = false;   // 換一天就重設回摺疊，與 App 一致
  render();
  try {
    await ensureBriefing(date);
  } catch (e) {
    state.error = `讀取 ${date} 的簡報失敗：${e.message}`;
  }
  render();
}

async function bootstrap() {
  try {
    const index = await fetchJson(`${REPO_BASE}/index.json${bust()}`);
    state.index = (index.briefings || []).filter((e) => e && e.date);

    if (!state.index.length) {
      state.loading = false;
      state.error = '目前還沒有任何簡報資料。';
      render();
      return;
    }

    state.selectedDate = state.index[0].date;
    await ensureBriefing(state.selectedDate);
    state.loading = false;
    render();

    // 背景把其他幾天也先抓下來，之後切換就不用等
    for (const e of state.index.slice(1, 7)) {
      ensureBriefing(e.date).catch(() => {});
    }
  } catch (e) {
    state.loading = false;
    state.error = '無法載入資料：' + e.message +
      '\n請確認網路連線，或稍後再試。';
    render();
  }
}

/* ---------- 事件 ---------- */
document.getElementById('navbar').addEventListener('click', (ev) => {
  const btn = ev.target.closest('.navitem');
  if (!btn) return;
  state.tab = btn.dataset.tab;
  screenEl.scrollTop = 0;
  render();
});

/* 狀態列的時鐘（純裝飾） */
function tick() {
  const d = new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2, '0') + ':' +
    String(d.getMinutes()).padStart(2, '0');
}
tick();
setInterval(tick, 30000);

bootstrap();
</script>
